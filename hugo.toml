baseURL                = "https://forward-blog.pages.dev/"
locale                 = "zh-cn"
defaultContentLanguage = "zh"
title                  = "Forward 的博客"
hasCJKLanguage         = true
theme                  = "hugo-theme-stack"

[pagination]
    pagerSize = 5

[permalinks]
    post = "/p/:slug/"
    page = "/:slug/"

[markup.goldmark.renderer]
    ## Set to true if you have HTML content inside Markdown
    unsafe = true

[markup.goldmark.extensions.passthrough]
    enable = true

    [markup.goldmark.extensions.passthrough.delimiters]
        block  = [["\\[", "\\]"], ["$$", "$$"]]
        inline = [["\\(", "\\)"]]

[markup.tableOfContents]
    startLevel = 2
    endLevel   = 4
    ordered    = true

[markup.highlight]
    noClasses          = false
    codeFences         = true
    guessSyntax        = true
    lineNos            = true
    lineNumbersInTable = true
    tabWidth           = 4

[params]
    mainSections   = ["post"]
    rssFullContent = true

    [params.footer]
        since = 2026

    [params.sidebar]
        emoji    = "✏️"
        subtitle = "记录学习与生活"

    [params.article]
        [params.article.license]
            enabled = true
            default = "Licensed under [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/)"

    [params.widgets]
        homepage = [
            { type = "search" },
            { type = "archives", params = { limit = 5 } },
            { type = "categories", params = { limit = 10 } },
            { type = "tag-cloud", params = { limit = 10 } },
        ]
        page = [{ type = "toc" }]

[[menu.social]]
    identifier = "github"
    name       = "GitHub"
    url        = "https://github.com/Forward-Back"

    [menu.social.params]
        icon = "brand-github"
